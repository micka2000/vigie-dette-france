name: Mise à jour des données

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_data.py
      - name: Commit si les séries ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet -- data/spread.json data/target.json data/non_residents_eurostat.json data/dette_pib.json; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "Données du $(date -u +%F)"
            git push
          fi
