name: Mise à jour des données

on:
  # Trois passages par jour : GitHub retarde souvent le cron de plusieurs heures, et la Banque de France
  # comme la Bundesbank publient la séance du jour à une heure variable. Sans nouvelle série, rien n'est commité.
  schedule:
    - cron: "30 6 * * *"
    - cron: "0 16 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Les tests tournent dans tests.yml, à chaque push : un test cassé ne bloque jamais la collecte.
      - name: Collecte (chaque série à part, France puis Canada)
        env:
          WEBSTAT_API_KEY: ${{ secrets.WEBSTAT_API_KEY }}
        run: python scripts/update_data.py || echo "ECHECS=1" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Versions CSV des séries pour data.gouv.fr (aperçu et tableur), dans data/csv/.
      - name: Fichiers CSV
        run: node scripts/exporter_csv.mjs || echo "CSV=1" >> "$GITHUB_ENV"
      # Instantané du jour dans le tableau de bord et les pages par signal (FR et EN), sitemap, images de partage.
      # Un échec ici ne bloque pas les données.
      - name: Pages et images de partage
        run: |
          # L'image d'abord : pages.mjs met son empreinte dans l'adresse og:image.
          pip install --quiet pillow==11.3.0 && python scripts/image_partage.py && node scripts/pages.mjs --instantane \
            || echo "PAGES=1" >> "$GITHUB_ENV"
      - name: Commit si les séries ou les échecs ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD:data/meta.json > "$RUNNER_TEMP/meta.json" 2>/dev/null || : > "$RUNNER_TEMP/meta.json"
          git show HEAD:data/canada/meta.json > "$RUNNER_TEMP/meta_canada.json" 2>/dev/null || : > "$RUNNER_TEMP/meta_canada.json"
          git add data sitemap.xml 'assets/images/partage-*.png' '*.html'  # tableau, pages par signal, en/
          # data/canada/ : collecte du Canada, isolée de la France (son propre meta.json).
          if ! python scripts/update_data.py --echecs-changes "$RUNNER_TEMP/meta.json" "$RUNNER_TEMP/meta_canada.json" \
             && git diff --cached --quiet -- . ':(exclude)data/meta.json' ':(exclude)data/canada/meta.json'; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "Données du $(date -u +%F)"
            git pull --rebase
            git push
          fi
      - name: Signaler l'échec des pages
        if: env.PAGES == '1'
        run: |
          echo "::error::Pages ou images de partage non régénérées (voir l'étape « Pages et images de partage »)"
          exit 1
      - name: Signaler l'échec des CSV
        if: env.CSV == '1'
        run: |
          echo "::error::Fichiers CSV non régénérés (voir l'étape « Fichiers CSV »)"
          exit 1
      - name: Signaler les séries en échec
        if: always() && env.ECHECS == '1'
        run: |
          python -c "import json; [print('::error::' + e['serie'] + ' : ' + e['erreur']) for e in json.load(open('data/meta.json'))['echecs']]"
          python -c "import json; [print('::error::Canada ' + e['serie'] + ' : ' + e['erreur']) for e in json.load(open('data/canada/meta.json'))['echecs']]" || true
          exit 1
